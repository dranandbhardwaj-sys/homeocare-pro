        'nat-c': `
            <h2 style="color: #0b7c68;">NATRIUM CARBONICUM</h2>
            <p><b>Carbonate of Soda (Na₂CO₃.10H₂O)</b></p>

        'nat-m': `
            <h2 style="color: #0b7c68;">NATRUM MURIATICUM</h2>
            <p><b>Common Salt (NaCl)</b></p>
            <h3>Constitution</h3>
            <ul><li>For the anemic and eutectic; whether form loss of vital fluids - profuse menses, seminal losses - or mental affections.</li></ul>
            <h3>Mental Generals</h3>
            <ul>
                <li>For the bad effects: Of anger (caused by offence); of grief, fright, vexation, mortification or reserved displeasure (Staph.).</li>
                <li>Irritability: Child cross when spoken to; crying from slightest cause; gets into a passion about trifles, especially when consoled with.</li>
                <li>Awkward, hasty, drops things from nervous weakness (Apis, Bov.).</li>
                <li>Marked disposition to weep; sad weeping mood, without cause (Puls.), but consolation from other < her troubles.</li>
                <li>Dreams: Of robbers in the house, and on waking will not believe to the contrary until search is made (Psor.); of burning thirst.</li>
            </ul>
            <h3>Physical Generals</h3>
            <ul>
                <li>Great emaciation; losing flesh while living well (Abrot., Iod.); throat and neck of children emaciate rapidly during summer complaint (Sanic.).</li>
                <li>Great liability to take cold (Calc., Kali-c.).</li>
                <li>Craving for salt (Calc., Caust.); great aversion to bread.</li>
                <li>For the bad effects of acid food, bread, quinine, excessive use of salts; of cauterization of all kinds with the silver nitrate.</li>
            </ul>
            <h3>Head</h3>
            <ul>
                <li>Headache: Anemic, of school girls (Calc-p.); from sunrise to sunset; left-sided clavus; as if bursting; with red face, nausea and vomiting before, during and after menses; as though a thousand little hammers were knocking in the brain during fever; > by perspiration.</li>
                <li>Headache; beginning with blindness (Iris, Kali-bi.); with zigzag dazzling, like lightning in eyes, ushering in a throbbing headache; from eye strain.</li>
                <li>The hair falls out when touched, in nursing women (Sep.); face oily, shiny, as if greased (Plb., Thuj.).</li>
            </ul>
            <h3>Eyes</h3>
            <ul><li>Lachrymation; tears stream down the face whenever he coughs (Euphr.).</li></ul>
            <h3>Mouth</h3>
            <ul>
                <li>Sensation as of a hair on the tongue (Sil.).</li>
                <li>Tongue: Mapped, with red insular patches; like ringworm on sides (Ars., Lach., Merc., Nit-ac., Tarax.); heavy, difficult speech, children slow in learning to walk.</li>
            </ul>
            <h3>Gastro-intestinal System</h3>
            <ul>
                <li>Constipation: Sensation of contraction of anus; torn, bleeding, smarting afterwards; stool dry, hard, difficult, crumbling (Am-c., Mag-m.); stitches in rectum (Nit-ac.); involuntary, knows not whether flatus or feces escape (Aloe, Iod., Mur-ac., Oldd., Podo.).</li>
            </ul>
            <h3>Urinary System</h3>
            <ul>
                <li>Urine: Involuntary when walking, coughing, laughing (Caust., Puls., Squil.); has to wait a long while for urine to pass, if others are present (Hep., Mur-ac.); cutting in urethra after (Sars.).</li>
            </ul>
            <h3>Male Reproductive System</h3>
            <ul>
                <li>Seminal emission: Soon after coition, with increased desire; weakness of organs with retarded emission during an embrace; impotence, spinal irritation, paralysis, after sexual excesses.</li>
            </ul>
            <h3>Female Reproductive System</h3>
            <ul><li>Pressing, pushing towards genitals every morning; must sit down to prevent prolapsus (Lil-t., Murx., Sep.).</li></ul>
            <h3>Respiratory System</h3>
            <ul><li>Hay fever: Squirming sensation in the nostril, as of a small worm; brought on by exposure to hot sun or intense summer heat.</li></ul>
            <h3>Cardio-vascular System</h3>
            <ul>
                <li>Fluttering of the heart; with a weak faint feeling < lying down (Lach.).</li>
                <li>The heart's pulsations shake the body (Spig.).</li>
            </ul>
            <h3>Extremities</h3>
            <ul><li>Painful contractions of the hamstrings (Am-m., Caust., Guaj.).</li></ul>
            <h3>Fever</h3>
            <ul>
                <li>Fever blisters, like pearls about the lips; lips dry, sore and cracked, ulcerated (Nit-ac.).</li>
                <li>Intermittent: Paroxysm at 10 or 11 a.m.; old, chronic, badly treated cases, especially after suppression by quinine; headache, with unconsciousness during chill and heat; sweat > pains.</li>
            </ul>
            <h3>Skin</h3>
            <ul>
                <li>Hangnails: Skin around the nails dry and cracked (Graph., Petr.); herpes about anus and on borders of hair at nape of neck (in bend of knees, Hep., Graph.).</li>
                <li>Warts on palms of hands (sore to touch, Nat-c.).</li>
                <li>Eczema; raw, red, inflamed, especially in edges of hair; < from eating too much salt, at seashore, or from ocean voyage.</li>
                <li>Urticaria, acute or chronic; over whole body, especially after violent exercise (Apis, Calc., Hep., Sanic., Urt-u.).</li>
            </ul>
            <h3>Modalities</h3>
            <ul>
                <li><b>Aggravation:</b> At 10 or 11 a.m.; at the seashore or from sea air; heat of sun or stove; mental exertion, talking, writing, reading; lying down.</li>
                <li><b>Amelioration:</b> In the open air (Apis, Puls.); cold bathing; going, without regular meals; lying on right side (on painful side, Bry., Ign., Puls.).</li>
            </ul>
            <p><b>Relation:</b> Complementary to Apis; acts well before and after it. Natrum mur. is the chronic of Ignatia, which is its vegetable analogue. Is followed by Sepia and Thuja. Cannot often be repeated in chronic cases without an intercurrent, called for by the symptoms. Should never be given during fever paroxysms. If vertigo and headache be very persistent, or prostration be prolonged after Natrium, Nux will relieve.</p>
        `,
        'nat-s': `
            <h2 style="color: #0b7c68;">NATRIUM SULPHURICUM</h2>
            <p><b>Sodium Sulphate (Na2SO4.10H2O)</b></p>
            <h3>Constitution</h3>
            <ul>
                <li>Patient feels every change from dry to wet; cannot tolerate sea air, nor eat plants that thrive near water; a constitution in which the gonorrheal poison is most pernicious; recovers slowly from every sickness.</li>
                <li>Every spring, skin affections reappear (Psor.).</li>
            </ul>
            <h3>Mental Generals</h3>
            <ul>
                <li>Mental traumas; mental effects from injuries to head; chronic brain effects of blows, falls. Inability to think (Nat-c.).</li>
                <li>Sad, gloomy, irritable; worse in morning; dislikes to speak or be spoken to (Iod., Sil.).</li>
                <li>Depressed; lively music makes her sad; satiety of life; must use great self-control to prevent shooting himself.</li>
            </ul>
            <h3>Physical Generals</h3>
            <ul><li>Ailments which are < by or which depend upon, dampness of weather, damp houses or cellars (Aran.).</li></ul>
            <h3>Eyes</h3>
            <ul><li>Granular lids: Like small blisters (Thuj.); green pus and terrible photophobia; gonorrhea or sycotic.</li></ul>
            <h3>Nose</h3>
            <ul><li>Nosebleed during menses (instead of menses, Bry., Puls.).</li></ul>
            <h3>Mouth</h3>
            <ul>
                <li>Toothache > by cold water, cool air (Coff., Puls.).</li>
                <li>Dirty, greenish-gray or brown coating on tongue.</li>
            </ul>
            <h3>Gastro-intestinal System</h3>
            <ul><li>Diarrhea: Sudden, urging, gushing, much flatus; on first rising and standing on the feet; after a spell of wet weather; living or working in basements.</li></ul>
            <h3>Male Reproductive System</h3>
            <ul><li>Gonorrhea: Greenish-yellow, painless, thick discharge (Puls.); chronic or suppressed (thick, green Kali-i.).</li></ul>
            <h3>Respiratory System</h3>
            <ul>
                <li>Dyspnea: Desire to take a deep breath during damp, cloudy weather.</li>
                <li>Humid asthma in children; with every change to wet weather; with every fresh cold; always worse in damp, rainy weather; sputa green, greenish, copious (greenish-gray, Cop.).</li>
                <li>Sycotic pneumonia: Lower lobe of left lung; great soreness of chest, during cough, has to sit up in bed and hold the chest with both hands (Nicc.—right lung, Bry.).</li>
            </ul>
            <h3>Nervous System</h3>
            <ul><li>Spinal meningitis: Violent, crushing gnawing pains at base of brain; head drawn back; spasms with mental irritability and delirium; violent congestion of blood to head; delirium; opisthotonos.</li></ul>
            <h3>Modalities</h3>
            <ul>
                <li><b>Aggravation:</b> Damp basements or dwellings; damp weather (Aran., Ars-i., Dulc.); rest; lying.</li>
                <li><b>Amelioration:</b> Dry weather; pressure, sitting up (cough); changing position (but > in wet weather, Caust.); open air.</li>
            </ul>
            <p><b>Relation:</b> Compare: Nat-m. and Sulph., which are very similar; Thuj. and Merc. in syphilis and sycosis occurring in hydrogenoid constitutions.</p>
        `,
        'nit-ac': `
            <h2 style="color: #0b7c68;">NITRICUM ACIDUM</h2>
            <p><b>Nitric Acid (HNO3)</b></p>
            <h3>Constitution</h3>
            <ul><li>Ailments: Which depend on some virulent poison; from mercury, syphilis, scrofula, in broken-down cachectic constitutions. Especially suited to thin persons of rigid fibre, dark complexions, black hair and eyes—the brunette rather than the blonde—nervous temperament. Persons suffering with chronic diseases who take cold easily; are easily disposed to diarrhea; rarely to those who suffer with constipation. Old people with great weakness and diarrhea.</li></ul>
            <h3>Mental Generals</h3>
            <ul>
                <li>After continued loss of sleep, long-lasting anxiety, over-exertion of mind and body from nursing the sick (Cocc.); anguish from the loss of his dearest friend; indifference; tired of life; sadness before menses.</li>
                <li>Great anxiety about his disease; constantly thinking about his past troubles; morbid fear of cholera (Ars.); depressed and anxious in the evening.</li>
                <li>Irritable, headstrong; hateful and vindictive; inveterate, ill-willed, unmoved by apologies.</li>
            </ul>
            <h3>Physical Generals</h3>
            <ul>
                <li>Excessive physical irritability.</li>
                <li>Pains: Sticking, pricking as from splinters; suddenly appearing and disappearing; on change of temperature or weather; during sleep; gnawing here and there as from ulcers forming.</li>
                <li>Sensation: Of a band around head, around the bones (Carb-ac., Sulph.); of a splinter in affected parts, ulcers, piles, throat, ingrowing toe nail < on slightest contact.</li>
                <li>Discharges: Thin, offensive, acrid; of a brown or dirty yellowish-green color, rarely laudable pus. Affects especially the mucus outlets of the body where skin and mucous membrane join; mouth, nose, rectum, anus, urethra, vagina (Mur-ac.).</li>
                <li>Ulcers: Easily bleeding; in corners of mouth (Nat-m.); splinterlike pains, especially on contact (Hep.); zig-zag, irregular edges; base looks like raw flesh; exuberant granulations; after mercury or syphilis or both, engrafted on a scrofulous base.</li>
                <li>Cracking: In ears, on masticating; of the joints, on motion (Cocc., Graph.).</li>
                <li>Hemorrhage: From bowels in typhoid or typhus (Crot., Mur-ac.); after miscarriage or post-partum; from over-exertion of body; bright, profuse, or dark.</li>
            </ul>
            <h3>Head</h3>
            <ul><li>Very sensitive to rattle of wagons over paved streets; headache from pressure of hat (Calc-p., Carb-v., Nat-m.).</li></ul>
            <h3>Ears</h3>
            <ul><li>Hardness of hearing > by riding in carriage or train (Graph.).</li></ul>
            <h3>Nose</h3>
            <ul><li>Ozena: Green casts from the nose every morning.</li></ul>
            <h3>Gastro-intestinal System</h3>
            <ul>
                <li>Diarrhea: Great straining but little passes, as if feces remained and cannot be expelled (Alum.); pain as if rectum or anus were torn or fissured (Nat-m.); violent cutting pains after stool, lasting for hours (Rat., Sulph. - during and after, Merc.).</li>
                <li>Fissures in rectum; tearing, spasmodic pains during stools; lancinating, even after soft stools (Alum., Nat-m., Rat.).</li>
            </ul>
            <h3>Urinary System</h3>
            <ul><li>Urine: Scanty, dark-brown, strong-smelling, "like horse's urine"; cold when it passes; turbid, looks like remains of a cider barrel.</li></ul>
            <h3>Skin</h3>
            <ul><li>Warts, condylomata; sycotic or syphilitic; large, jagged, pedunculated; bleeding readily on washing; moist, oozing; sticking pain (Staph., Thuj.).</li></ul>
            <h3>Modalities</h3>
            <ul>
                <li><b>Aggravation:</b> Evening and at night; after midnight; contact; change of temperature of weather; during sweat; on walking; while walking.</li>
                <li><b>Amelioration:</b> While riding in a carriage (reverse of Cocc.).</li>
            </ul>
            <p><b>Relation:</b> Complementary: Ars. and Calad. Inimical: To Lachesis. Resembles: Ars. in morbid fear of cholera. Often difficult to distinguish from Merc.; but is adapted to black-haired people, while Merc. is more useful in light-haired persons. Relieves ailments resulting from abuse of mercury, especially if there be erethism; bad effects of repeated doses of Digitalis. Follows well: Calc., Hep., Merc., Nat-c., Puls. or Thuj.; but is most effective after Kali-c.</p>
        `,
        'nux-m': `

            <p><b>Nutmeg (Myristicaceae)</b></p>
            <h3>Constitution</h3>

                <li>Adapted especially to women and children of a nervous hysterical temperament (Ign.); to people with a dry skin, who rarely perspire; complaints of pregnancy.</li>
                <li>Weakness of old age; dyspepsia of old people.</li>

            <h3>Mental Generals</h3>

                <li>Absence of mind; cannot think; indifference to everything.</li>
                <li>Weakness or loss of memory (Anac., Lac-c., Lyc.).</li>
                <li>Vanishing of thoughts while reading, talking or writing; uses wrong words; does not recognize well-known streets (Cann-i., Lach.).</li>
                <li>Changeable humor; one moment laughing, the next crying (Croc., Ign.); "sudden change from grave to gay, from lively to serene" (Plat.).</li>
            </ul>
            <h3>Physical Generals</h3>
            <ul>
                <li>Oversensitive: To light; of hearing; of smell; to touch.</li>

                <li>Stupor and insensibility; unconquerable sleep. Great soreness of all the parts upon which one lies (Bapt., Pyrog.); tendency to bedsores.</li>
                <li>Sleep: Irresistibly drowsy; sleepy, muddled, as if intoxicated; coma, lies silent, immovable; eyes constantly closed (with stertorous breathing, Op.).</li>
                <li>Fatigue, must lie down after the least exertion.</li>
                <li>Rheumatic affections; from getting feet wet; from exposure to drafts of air while heated (Acon., Bry.); < in cold, wet weather, or cold wet clothes (Rhus-t.); of left shoulder (Ferr.).</li>

            <ul><li>Dryness of eyes; too dry to close the lids.</li></ul>
            <h3>Mouth</h3>

            <h3>Modalities</h3>

                <li><b>Amelioration:</b> In dry, warm weather; warm room; wrapping up warmly.</li>

            <p><b>Relation:</b> Nux moschata antidotes mercurial inhalation, lead colic, oil of turpentine, spirituous liquors, and especially the effects of bad beer.</p>

        'nux-v': `
            <h2 style="color: #0b7c68;">NUX VOMICA</h2>
            <p><b>Poison Nut (Loganiaceae)</b></p>
            <h3>Constitution</h3>
            <ul>
                <li>One of the best remedies with which to commence treatment of cases that have been drugged by mixtures, bitters, vegetable pills, nostrums or quack remedies, especially aromatic or "hot medicines," but only if symptoms correspond. Adapted to thin, irritable, careful, zealous persons with dark hair and bilious or sanguine temperament. Disposed to be quarrelsome, spiteful, malicious; nervous and melancholic. Debauchers of a thin, irritable, nervous disposition, prone to indigestion and hemorrhoids (persons with light hair, blue eyes, Lob.).</li>
                <li>"Nux is chiefly successful with persons of an ardent character; of an irritable, impatient temperament, disposed to anger, spite or deception."—Hahnemann.</li>

                <li>Hypochondriac: Literary, studious persons, who are too much at home, suffer from want of exercise, with gastric, abdominal complaints and coviseness; especially in drunkards.</li>

                <li>Oversensitive: To external impressions; to noise, odors, light or music (Nux-m.); trifling ailments are unbearable (Cham.); every harmless word offends (Ign.).</li>
                <li>Pains are tingling, sticking, hard, aching, worse from motion and contact.</li>
                <li>Tendency to faint (Nux-m., Sulph.); from odors; in morning; after eating; after every labor pain.</li>

            <h3>Nose</h3>
            <ul><li>Catarrh: Snuffles of infants (Am-c., Samb.); coryza, dry at night, fluent by day; < in warm room, > in cold air; from sitting in cold places, on stone steps.</li></ul>

            <ul>
                <li>Menses: Too early, profuse, lasts too long; or keeping on several days longer, with complaints at onset and remaining after; every two weeks; irregular, never at right time; stooping and starting again (Sulph.); during and after, < of old symptoms.</li>
                <li>Labor pains: Violent, spasmodic; cause urging to stool or to urinate; < in back; prefers a warm room.</li>

            <h3>Back</h3>
            <ul><li>Backache: Must sit up to turn over in bed; lumbago; from sexual weakness, from masturbation.</li></ul>
            <h3>Nervous System</h3>

            <h3>Fever</h3>
            <ul>
                <li>Repugnance to cold or to cold air; chilly, on least movement; from being uncovered; must be covered in every stage of fever—chill, heat or sweat.</li>

            <h3>Modalities</h3>

            <p><b>Relation:</b> Complementary: Sulphur in early all diseases. Inimical: To Zinc.; must not be used before or after. Follows well: After Ars., Ip., Phos., Sep., Sulph. Is followed well: By Bry., Puls., Sulph. Nux should be given on retiring or, what is better, several hours before going to bed; it acts best during repose of mind and body.</p>

        'opium': `

    // Functions to control the Book UI
    function openAllenBook() {
        document.getElementById('allenBookContainer').style.display = 'block';
        document.getElementById('allenMedicineList').style.display = 'grid';
        document.getElementById('allenContentArea').style.display = 'none';
    }

    function closeAllenBook() {
        document.getElementById('allenBookContainer').style.display = 'none';
    }

    function showAllenRemedy(remedyKey) {
        document.getElementById('allenMedicineList').style.display = 'none';
        document.getElementById('allenContentArea').style.display = 'block';
        document.getElementById('allenTextContent').innerHTML = allenData[remedyKey];
        window.scrollTo(0, 0); // Scroll to top
    }

    function backToAllenList() {
        document.getElementById('allenContentArea').style.display = 'none';
        document.getElementById('allenMedicineList').style.display = 'grid';
    }
