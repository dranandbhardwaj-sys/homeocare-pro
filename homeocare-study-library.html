    // Render Function
    function renderOrganon(dataToRender = organonData) {
        const listContainer = document.getElementById('organonList');
        if (!listContainer) return;

        if (dataToRender.length === 0) {
            listContainer.innerHTML = `<p style="text-align: center; color: #666; margin-top: 20px;">No aphorism found for your search.</p>`;
            return;
        }

        listContainer.innerHTML = dataToRender.map(item => `
            <div style="background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); border-left: 4px solid #8e44ad;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 5px;">
                    <span style="font-size: 12px; color: #8e44ad; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">${item.topic}</span>
                    <span style="background: #f4ecf7; color: #8e44ad; padding: 3px 8px; border-radius: 12px; font-weight: bold; font-size: 13px;">Aph. ${item.aph}</span>
                </div>
                <p style="margin: 0; font-size: 15px; color: #333; font-weight: 500;">${item.desc}</p>
            </div>
        `).join('');
    }

    // Open/Close Functions
    function openOrganon() {
        document.getElementById('organonContainer').style.display = 'block';
        document.getElementById('orgSearch').value = ''; 
        renderOrganon(); 
    }

    function closeOrganon() {
        document.getElementById('organonContainer').style.display = 'none';
    }

    // Filter Function
    function filterOrganon() {
        const query = document.getElementById('orgSearch').value.toLowerCase();
        const filteredData = organonData.filter(item => 
            item.desc.toLowerCase().includes(query) || 
            item.topic.toLowerCase().includes(query) || 
            item.aph.includes(query)
        );
        renderOrganon(filteredData);
    }
